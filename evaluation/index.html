<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Building Evaluation</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
</head>
<body>

<div id="app">

  <div id="image-container">
    <img id="patch" src="" />
  </div>

<div id="controls">
  <h2 id="title">Building</h2>

  <!-- ORIGINAL -->
  <div class="question">
    <p>Original (Google)</p>

    <div id="model-tags"></div>

    <button onclick="answer('original','correct', this)">Correct</button>
    <button onclick="answer('original','partial', this)">Partially</button>
    <button onclick="answer('original','wrong', this)">Wrong</button>
  </div>

  <!-- SAM -->
  <div class="question">
    <p>SAM vs Original</p>
    <button onclick="answer('sam','better', this)">Better</button>
    <button onclick="answer('sam','same', this)">Same</button>
    <button onclick="answer('sam','worse', this)">Worse</button>
  </div>

  <!-- POST -->
  <div class="question">
    <p>Final Result (Post)</p>
    <button onclick="answer('post','perfect', this)">Perfect</button>
    <button onclick="answer('post','good', this)">Good</button>
    <button onclick="answer('post','ok', this)">OK</button>
    <button onclick="answer('post','bad', this)">Bad</button>
  </div>

  <!-- TAG SELECTOR -->
  <div class="question" id="tag-section" style="display:none;">
    <p>What is wrong?</p>

    <button onclick="toggleTag('MISALIGNED', this)">Misaligned</button>
    <button onclick="toggleTag('SHAPE_MISMATCH', this)">Shape mismatch</button>
    <button onclick="toggleTag('MISSING_PARTS', this)">Missing parts</button>
    <button onclick="toggleTag('EXTRA_PARTS', this)">Extra parts</button>
    <button onclick="toggleTag('OVERSIMPLIFIED', this)">Oversimplified</button>
  </div>

  <button onclick="nextSample()">Next →</button>
</div>

</div>

<script src="app.js"></script>
</body>
</html>
