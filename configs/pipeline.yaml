data:
  geotiff: data/zurich.tif
  out_gpkg: outputs/buildings.gpkg
  out_layer: buildings
  out_crops_dir: outputs/crops
  out_points_png: outputs/points_preview.png

sam:
  checkpoint: sam_vit_b.pth
  generator:
    points_per_side: 32
    pred_iou_thresh: 0.86
    stability_score_thresh: 0.92
  tile_size: 1024
  overlap: 128
  upscale: 1.0
  device: auto

post:
  min_area_m2: 10
  max_area_m2: 10000
  clean_buffer_m: 0.5
  clean_debuffer_m: 0.5
  merge_gap_m: 1.0

mllm:
  model_id: OpenGVLab/InternVL2-4B
  device: cuda
  max_new_tokens: 256
